[build-system]
requires = ["hatchling>=1.21.1"]
build-backend = "hatchling.build"

[project]
name = "agent-ready-checkout-gateway"
version = "0.1.0"
description = "Reference implementation of an ACP-compliant agent-ready checkout gateway."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Agent Ready Checkout Gateway Maintainers" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "fastapi==0.136.1",
    "uvicorn[standard]==0.27.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "sqlalchemy[asyncio]==2.0.28",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "stripe==8.6.0",
    "httpx==0.27.0",
    "structlog==24.1.0",
    "python-json-logger==2.0.7",
    "python-dotenv==1.2.2",
    "cryptography==46.0.7",
    "passlib[bcrypt]==1.7.4",
    "pyjwt[crypto]==2.12.0",
    "cachetools==5.3.3",
    "slowapi==0.1.9",
    "opentelemetry-api==1.42.0",
    "opentelemetry-sdk==1.42.0",
    "opentelemetry-exporter-otlp==1.42.0",
    "opentelemetry-instrumentation-fastapi==0.63b0",
    "opentelemetry-instrumentation-httpx==0.63b0",
    "langfuse==2.60.10",
    "langgraph==1.0.10",
    "c2pa-python==0.32.6",
    "pillow==12.2.0",
    "reportlab==4.0.9",
    "aiofiles==23.2.1",
    "python-multipart==0.0.27",
    "orjson==3.11.6",
    "tenacity==8.2.3",
    "aiosqlite==0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "mypy==1.9.0",
    "ruff==0.3.4",
    "bandit==1.7.9",
    "types-cachetools==5.3.0.7",
    "types-python-dateutil==2.8.19.20240106",
    "coverage[toml]==7.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "ASYNC",
]
ignore = [
    "B008",
]

[tool.pytest.ini_options]
addopts = "-p pytest_asyncio.plugin --cov=packages --cov=apps --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
branch = true
source = [
    "apps",
    "packages",
    "clients",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_return_any = true
ignore_missing_imports = true
exclude = ["clients/mock-agent"]
explicit_package_bases = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages", "clients"]
