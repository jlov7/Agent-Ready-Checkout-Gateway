name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      DATABASE_URL: sqlite+aiosqlite:///./test_gateway.db
      STRIPE_API_KEY: sk_test_placeholder
      HMAC_WEBHOOK_SECRET: secret123
      ALLOWED_AGENT_DOMAINS: agents.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy .
      - name: Bandit
        run: bandit -r apps packages clients -x '*/tests/*'
      - name: Pytest
        run: pytest -p pytest_cov
